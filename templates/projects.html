
<!DOCTYPE html>
<html>
<head>
    <title>{{ title }} - Projects</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            margin: 0;
            padding: 30px;
        }

        h1 {
            text-align: center;
            color: #222;
        }

        .project-container {
            display: grid;
            grid-template-columns: repeat(
                auto-fit, minmax(250px, 1fr)
            );
            gap: 20px;
            max-width: 1100px;
            margin: 30px auto;
        }

        .project-card {
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.1);
            transition: 0.3s;
        }

        .project-card:hover {
            transform: translateY(-5px);
        }

        .project-card h2 {
            color: #1769aa;
        }

        .project-card p {
            color: #555;
            line-height: 1.6;
        }
    </style>
</head>

<body>

    <h1>{{ title }} - Our Projects</h1>
    <p style="text-align:center">{{ description }}</p>

    <div class="project-container">

        {% for project in projects %}

            <div class="project-card">

                <h2>{{ project.name }}</h2>

                <p>{{ project.description }}</p>

            </div>

        {% empty %}

            <p>No projects available.</p>

        {% endfor %}

    </div>

</body>
</html>
